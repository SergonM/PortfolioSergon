name = "sgm-analyst"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# The browser origins allowed to call the analyst. The Gemini key is a secret, never a var.
ALLOWED_ORIGINS = "https://sergonm.github.io,http://localhost:4321,http://localhost:4322"
GEMINI_MODEL = "gemini-flash-latest"

# At most 8 questions per minute per visitor (Workers rate limiting binding).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[observability]
enabled = true
